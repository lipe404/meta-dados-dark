<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}MetadataDark{% endblock %}</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="{{ url_for('static', filename='css/style.css') }}"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="header-content">
          <h1 class="logo">
            <i class="fas fa-database"></i>
            MetadataDark
          </h1>
          <nav class="nav">
            <a href="{{ url_for('index') }}" class="nav-link">
              <i class="fas fa-home"></i>
              Início
            </a>
          </nav>
        </div>
      </header>

      <main class="main">
        {% with messages = get_flashed_messages(with_categories=true) %} {% if
        messages %}
        <div class="messages">
          {% for category, message in messages %}
          <div class="message message-{{ category }}">
            <i
              class="fas fa-{% if category == 'success' %}check-circle{% elif category == 'error' %}exclamation-circle{% elif category == 'warning' %}exclamation-triangle{% else %}info-circle{% endif %}"
            ></i>
            {{ message }}
            <button class="message-close" onclick="this.parentElement.remove()">
              <i class="fas fa-times"></i>
            </button>
          </div>
          {% endfor %}
        </div>
        {% endif %} {% endwith %} {% block content %}{% endblock %}
      </main>

      <footer class="footer">
        <p>&copy; 2025 MetadataDark. Desenvolvido com Flask por Felipe Toledo</p>
      </footer>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  </body>
</html>
